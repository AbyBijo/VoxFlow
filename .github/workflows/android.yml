# VoxFlow — Android CI (Slice 1+)
name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Fetch sherpa-onnx AAR (pinned, verified)
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-static-link-onnxruntime-1.13.3.aar
          SIZE=$(stat -c%s app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar)
          SHA=$(sha256sum app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar | cut -d' ' -f1)
          echo "AAR size=$SIZE sha256=$SHA"
          [ "$SIZE" = "38398784" ] || { echo "AAR size mismatch"; exit 1; }
          [ "$SHA" = "9f065fe6f2cab09fd48eaa580097293e077637ad53a5e89c5c58a36509386ac7" ] || { echo "AAR SHA-256 mismatch"; exit 1; }
      - name: Manifest check (one Activity, no splash)
        run: |
          MANIFEST=app/src/main/AndroidManifest.xml
          N_ACT=$(grep -c '<activity' "$MANIFEST")
          echo "activities=$N_ACT"
          [ "$N_ACT" = "1" ] || { echo "Expected exactly 1 Activity, found $N_ACT"; exit 1; }
          if grep -qi 'splash' "$MANIFEST"; then echo "Splash entry found in manifest"; exit 1; fi
          echo "Manifest OK: single Activity, no splash."
      - name: Decode release keystore (if secrets present)
        id: release_key
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/voxflow-release.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No release secrets — release build will be skipped."
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain
      - name: Build release APK + AAB
        if: steps.release_key.outputs.present == 'true'
        run: |
          gradle :app:assembleRelease :app:bundleRelease --console=plain -PvoxflowReleaseKeystore=/tmp/voxflow-release.jks -PvoxflowReleaseStorePassword='${{ secrets.KEYSTORE_PASSWORD }}' -PvoxflowReleaseKeyAlias='${{ secrets.KEY_ALIAS }}' -PvoxflowReleaseKeyPassword='${{ secrets.KEY_PASSWORD }}'
      - name: Signing fingerprints (debug vs release must differ)
        if: steps.release_key.outputs.present == 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          echo "== debug =="
          "$APKSIGNER" verify --print-certs "$DEBUG_APK"
          echo "== release =="
          "$APKSIGNER" verify --print-certs "$RELEASE_APK"
          DEBUG_FP=$("$APKSIGNER" verify --print-certs "$DEBUG_APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          RELEASE_FP=$("$APKSIGNER" verify --print-certs "$RELEASE_APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "debug SHA-256:   $DEBUG_FP"
          echo "release SHA-256: $RELEASE_FP"
          [ -n "$DEBUG_FP" ] && [ -n "$RELEASE_FP" ] || { echo "Could not read a fingerprint"; exit 1; }
          [ "$DEBUG_FP" != "$RELEASE_FP" ] || { echo "FAIL: debug and release fingerprints are identical"; exit 1; }
          echo "Fingerprints are distinct — OK."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voxflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        if: steps.release_key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voxflow-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload release AAB
        if: steps.release_key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voxflow-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
